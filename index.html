      window.addEventListener('error', function(e) {
        if (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('createWebSocketModuleRunnerTransport') !== -1)) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (String(e.reason).indexOf('WebSocket') !== -1 || String(e.reason).indexOf('createWebSocketModuleRunnerTransport') !== -1)) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
